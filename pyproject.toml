[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-whoosh"
version = "0.1.0"
description = "Mojo-accelerated inverted indexes and query evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {file = "LICENSE"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
